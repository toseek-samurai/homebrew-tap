name: Formula installation

on:
  push:
    branches: [main]
    paths: ['Formula/**', 'tests/installation_smoke.py']
  pull_request:
    paths: ['Formula/**', 'tests/installation_smoke.py']
  workflow_dispatch:
  workflow_call:
    inputs:
      recipe_artifact:
        type: string
        default: ''
      recipe_sha256:
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: formula-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installation:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 60 || 40 }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_AUTOREMOVE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify preview synchronization guards
        run: python3 -B tests/test_sync_preview.py
      - name: Download the candidate recipe
        if: inputs.recipe_artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.recipe_artifact }}
          path: ${{ runner.temp }}/shin-recipe
      - name: Select the qualified Apple toolchain
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
      - uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3
        with:
          stable: true
      - name: Load the formula after Homebrew resets the tap checkout
        env:
          RECIPE_ARTIFACT: ${{ inputs.recipe_artifact }}
          RECIPE_SHA256: ${{ inputs.recipe_sha256 }}
        run: |
          brew tap toseek-samurai/tap
          recipe="$(brew --repository toseek-samurai/tap)/Formula/shin-context-engine.rb"
          if [[ -n "$RECIPE_ARTIFACT" ]]; then
            candidate="$RUNNER_TEMP/shin-recipe"
            python3 -B tools/sync_preview.py overlay --candidate "$candidate" --sha256 "$RECIPE_SHA256"
          fi
          if ! [[ Formula/shin-context-engine.rb -ef "$recipe" ]]; then
            install -m 0644 Formula/shin-context-engine.rb "$recipe"
          fi
          brew trust --formula toseek-samurai/tap/shin-context-engine
          if [[ -n "$RECIPE_ARTIFACT" ]]; then
            printf '%s  %s\n' "$RECIPE_SHA256" "$recipe" | shasum -a 256 -c
            expected_version="$(jq -er '.tag | ltrimstr("v")' "$candidate/upstream-preview.json")"
            expected_core="$(jq -er '.core_version' "$candidate/upstream-preview.json")"
            brew info --json=v2 toseek-samurai/tap/shin-context-engine |
              jq -e --arg version "$expected_version" '.formulae[0].versions.stable == $version'
            echo "SHIN_EXPECTED_VERSION=$expected_version" >> "$GITHUB_ENV"
            echo "SHIN_EXPECTED_CORE_VERSION=$expected_core" >> "$GITHUB_ENV"
          fi
      - name: Recipe style and audit
        run: |
          brew style Formula/shin-context-engine.rb
          brew audit --strict toseek-samurai/tap/shin-context-engine
      - name: Remove the Intel runner's stale OpenSSL link
        if: matrix.os == 'macos-15-intel'
        run: |
          prefix="$(brew --prefix)"
          link="$prefix/bin/openssl"
          case "$(readlink "$link" || true)" in
            "$prefix/opt/openssl@1.1/bin/openssl"|../opt/openssl@1.1/bin/openssl)
              rm "$link"
              ;;
          esac
      - name: Prepare Intel certificate dependencies
        if: matrix.os == 'macos-15-intel'
        shell: bash
        run: |
          install_dependency() {
            local formula="$1"
            if brew install "$formula"; then
              return
            fi
            # Homebrew can leave an installed keg after a failed post-install.
            # Retry the package's own step only for the version it just selected.
            brew info --json=v2 "$formula" |
              jq -e '.formulae[0] | .versions.stable as $current | any(.installed[]; .version == $current)'
            brew postinstall --verbose "$formula"
          }
          install_dependency ca-certificates
          install_dependency openssl@3
      - name: Install complete package
        run: brew install toseek-samurai/tap/shin-context-engine
      - name: Verify linkage, formula smoke test and Monitor signature
        run: |
          brew linkage --test toseek-samurai/tap/shin-context-engine
          brew test toseek-samurai/tap/shin-context-engine
          codesign --verify --deep --strict "$(brew --prefix shin-context-engine)/Shin Monitor.app"
      - name: Seed isolated project and client settings
        run: |
          python3 -B tests/installation_smoke.py --prefix "$(brew --prefix shin-context-engine)" \
            --workspace "$RUNNER_TEMP/shin-installation" --phase seed
      - name: Reinstall and verify preserved state
        run: |
          brew reinstall toseek-samurai/tap/shin-context-engine
          python3 -B tests/installation_smoke.py --prefix "$(brew --prefix shin-context-engine)" \
            --workspace "$RUNNER_TEMP/shin-installation" --phase verify
      - name: Uninstall preserves data
        run: |
          brew uninstall toseek-samurai/tap/shin-context-engine
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sqlite3
          root = Path(os.environ['RUNNER_TEMP']) / 'shin-installation'
          baseline = json.loads((root / 'baseline.json').read_text())
          assert hashlib.sha256((root / 'sample project/sample.cpp').read_bytes()).hexdigest() == baseline['source_sha256']
          assert hashlib.sha256((root / 'user/codex.toml').read_bytes()).hexdigest() == baseline['client_sha256']
          history = root / 'state/service/history/telemetry.sqlite'
          assert history.stat().st_ino == baseline['history_inode']
          with sqlite3.connect(f'file:{history}?mode=ro', uri=True) as db:
              assert db.execute('PRAGMA quick_check').fetchone()[0] == 'ok'
          PY
